<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Buque AR</title>
    <meta name="theme-color" content="#000000" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #c {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
      }
      #ui {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #btn {
        position: absolute;
        left: 50%;
        bottom: clamp(20px, 5vw, 36px);
        transform: translateX(-50%);
        pointer-events: auto;
        padding: clamp(12px, 3vw, 16px) clamp(20px, 5vw, 32px);
        border: none;
        border-radius: 999px;
        background: #fff;
        color: #111;
        font-size: clamp(14px, 3.5vw, 16px);
        font-weight: 600;
        box-shadow: 0 20px 60px -30px #fff;
      }
      #btn.hidden {
        display: none;
      }
      #msg {
        position: absolute;
        top: clamp(14px, 3.5vw, 20px);
        left: 50%;
        transform: translateX(-50%);
        padding: clamp(6px, 2vw, 8px) clamp(10px, 3vw, 14px);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        font-size: clamp(11px, 2.8vw, 12px);
        backdrop-filter: blur(6px);
        white-space: nowrap;
        max-width: 90vw;
      }
      #msg.hidden {
        display: none;
      }
      #ret {
        position: absolute;
        top: 50%;
        left: 50%;
        width: clamp(60px, 15vw, 80px);
        height: clamp(60px, 15vw, 80px);
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255, 255, 255, 0.95);
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
      }
      #ret.show {
        opacity: 1;
      }
      #ret::before,
      #ret::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: clamp(8px, 2vw, 10px);
        height: 2px;
        background: #fff;
        transform: translate(-50%, -50%);
      }
      #ret::after {
        transform: translate(-50%, -50%) rotate(90deg);
      }
      #dot {
        position: absolute;
        top: 50%;
        left: 50%;
        width: clamp(5px, 1.2vw, 7px);
        height: clamp(5px, 1.2vw, 7px);
        border-radius: 50%;
        background: #fff;
        transform: translate(-50%, -50%);
        animation: p 1.5s ease-in-out infinite;
      }
      @keyframes p {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(0.9);
          opacity: 0.95;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.15);
          opacity: 1;
        }
      }
      #back {
        position: absolute;
        top: clamp(10px, 2.5vw, 14px);
        left: clamp(10px, 2.5vw, 14px);
        pointer-events: auto;
        padding: clamp(5px, 2vw, 7px) clamp(8px, 2vw, 10px);
        border: none;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        font-size: clamp(11px, 2.5vw, 12px);
        backdrop-filter: blur(6px);
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui">
      <button id="back">← Volver</button>
      <div id="msg" class="hidden"></div>
      <div id="ret"><div id="dot"></div></div>
      <button id="btn" class="hidden">Ver en AR</button>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const canvas = document.getElementById("c");
      const btn = document.getElementById("btn");
      const msg = document.getElementById("msg");
      const ret = document.getElementById("ret");
      const back = document.getElementById("back");

      let scene, cam, rend;
      let model, hitSrc = null, hitReq = false;
      let ar = false, placed = false, sess = null;

      back.onclick = () => (location.href = "./index.html");
      const showMsg = (t, ms = 2200) => {
        msg.textContent = t;
        msg.classList.remove("hidden");
        clearTimeout(showMsg.t);
        showMsg.t = setTimeout(() => msg.classList.add("hidden"), ms);
      };

      async function init() {
        scene = new THREE.Scene();
        cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);
        scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3));
        const l = new THREE.DirectionalLight(0xffffff, 1.4);
        l.position.set(1, 3, 2);
        scene.add(l);

        rend = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        rend.setPixelRatio(Math.min(devicePixelRatio, 2));
        rend.setSize(innerWidth, innerHeight);
        rend.xr.enabled = true;
        rend.xr.setReferenceSpaceType("local");

        const geo = new THREE.RingGeometry(0.125, 0.185, 32).rotateX(-Math.PI / 2);
        const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const rmesh = new THREE.Mesh(geo, mat);
        rmesh.matrixAutoUpdate = false;
        rmesh.visible = false;
        scene.add(rmesh);
        window._ret = rmesh;

        new GLTFLoader().load(
          "./ALMT_BLANCO.glb",
          (g) => {
            model = g.scene;
            model.visible = false;
            model.traverse((c) => {
              if (c.isMesh && c.material) {
                c.castShadow = c.receiveShadow = true;
                c.material.metalness = 0.05;
                c.material.roughness = 0.85;
              }
            });
            scene.add(model);
            if (navigator.xr) {
              try {
                const check = await navigator.xr.isSessionSupported("immersive-ar");
                if (check) btn.classList.remove("hidden");
              } catch (e) {
                /* ignore */
              }
            }
          },
          (x) => {},
          () => showMsg("Error cargando modelo", 2500)
        );

        rend.xr.addEventListener("sessionstart", () => {
          ar = true;
          placed = false;
          if (model) model.visible = false;
          if (window._ret) window._ret.visible = false;
          hitSrc = null;
          hitReq = false;
          btn.classList.add("hidden");
          back.classList.add("hidden");
          ret.classList.add("show");
        });
        rend.xr.addEventListener("sessionend", () => {
          ar = false;
          sess = null;
          ret.classList.remove("show");
          if (window._ret) window._ret.visible = false;
          if (model) model.visible = false;
          if (navigator.xr) btn.classList.remove("hidden");
          back.classList.remove("hidden");
        });

        canvas.addEventListener("click", () => {
          if (ar && window._ret && window._ret.visible && model && !placed) {
            model.position.setFromMatrixPosition(window._ret.matrix);
            model.quaternion.setFromRotationMatrix(window._ret.matrix);
            model.scale.set(0.08, 0.08, 0.08);
            model.visible = true;
            placed = true;
            window._ret.visible = false;
            ret.classList.remove("show");
          }
        });
        addEventListener("resize", () => {
          cam.aspect = innerWidth / innerHeight;
          cam.updateProjectionMatrix();
          rend.setSize(innerWidth, innerHeight);
        });

        rend.setAnimationLoop(render);
      }

      btn.onclick = async () => {
        if (sess) return;
        try {
          sess = await navigator.xr.requestSession("immersive-ar", {
            requiredFeatures: ["hit-test"],
          });
          rend.xr.setSession(sess);
        } catch (e) {
          showMsg("AR no disponible", 2200);
        }
      };

      function render(_, frame) {
        if (ar && frame && !placed) {
          const ref = rend.xr.getReferenceSpace();
          const s = rend.xr.getSession();
          const rmesh = window._ret;
          if (ref && s && rmesh) {
            if (!hitReq) {
              s.requestReferenceSpace("viewer")
                .then((vs) => s.requestHitTestSource({ space: vs }).then((src) => (hitSrc = src)))
                .catch(() => {});
              s.addEventListener("end", () => {
                hitReq = false;
                hitSrc = null;
              });
              hitReq = true;
            }
            if (hitSrc) {
              const res = frame.getHitTestResults(hitSrc);
              if (res.length > 0) {
                const p = res[0].getPose(ref);
                if (p) {
                  rmesh.visible = true;
                  rmesh.matrix.fromArray(p.transform.matrix);
                }
              } else {
                rmesh.visible = false;
              }
            }
          }
        }
        rend.render(scene, cam);
      }

      init();
    </script>
  </body>
</html>
