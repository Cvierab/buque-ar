<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buque AR - ALMT BLANCO</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; right: 10px; color: white; text-align: center; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 4px; z-index: 10; }
    #ar-button { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; z-index: 10; cursor: pointer; display: none; }
    #ar-button:disabled { background: #666; }
    #ar-button.visible { display: block; }
  </style>
</head>
<body>
  <div id="info">Cargando visor AR del buque...</div>
  <button id="ar-button">Entrar a AR</button>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
