<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no" />
<title>AR</title>
<meta name="theme-color" content="#000000" />
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000;width:100%;height:100%}
canvas{position:fixed;inset:0;width:100vw;height:100dvh}
#btn{position:fixed;left:50%;bottom:clamp(20px,5vw,40px);transform:translateX(-50%);z-index:20;border:0;border-radius:999px;background:#fff;color:#111;padding:clamp(12px,3vw,16px) clamp(22px,5.5vw,34px);font:600 clamp(14px,3.5vw,16px)/1 system-ui;box-shadow:0 20px 60px -30px #fff;pointer-events:auto}
#btn.hide{display:none}
#back{position:fixed;top:clamp(10px,2.5vw,14px);left:clamp(10px,2.5vw,14px);z-index:20;border:0;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;padding:clamp(5px,2vw,7px) clamp(9px,2.2vw,11px);font:clamp(11px,2.5vw,12px)/1 system-ui;backdrop-filter:blur(6px);pointer-events:auto}
#ret{position:fixed;top:50%;left:50%;width:clamp(60px,15vw,80px);height:clamp(60px,15vw,80px);transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;opacity:0;pointer-events:none;z-index:15}
#ret.on{opacity:1}
#ret:before,#ret:after{content:"";position:absolute;top:50%;left:50%;width:clamp(8px,2vw,10px);height:2px;background:#fff;transform:translate(-50%,-50%)}
#ret:after{transform:translate(-50%,-50%) rotate(90deg)}
#dot{position:absolute;top:50%;left:50%;width:clamp(5px,1.2vw,7px);height:clamp(5px,1.2vw,7px);border-radius:50%;background:#fff;transform:translate(-50%,-50%);animation:p 1.4s ease-in-out infinite}
@keyframes p{0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.98}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="back">← Volver</button>
<div id="ret"><div id="dot"></div></div>
<button id="btn" class="hide">Ver en AR</button>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const c=document.getElementById("c"),btn=document.getElementById("btn"),back=document.getElementById("back"),ret=document.getElementById("ret");
let s,cam,r,mod,hs=null,hq=false,ar=false,p=false,x=null,Rm=null;
back.onclick=()=>location.href="./index.html";
addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
async function init(){
  s=new THREE.Scene();cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,15);
  s.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,2.5));
  const dl=new THREE.DirectionalLight(0xffffff,1.3);dl.position.set(1,3,2);s.add(dl);
  r=new THREE.WebGLRenderer({canvas:c,alpha:true,antialias:true});
  r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.xr.enabled=true;r.xr.setReferenceSpaceType("local");
  const g=new THREE.RingGeometry(.12,.18,32).rotateX(-Math.PI/2);Rm=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffffff}));Rm.matrixAutoUpdate=false;Rm.visible=false;s.add(Rm);
  new GLTFLoader().load("./ALMT_BLANCO.glb",(gl)=>{mod=gl.scene;mod.visible=false;s.add(mod);
    if("xr"in navigator){navigator.xr.isSessionSupported("immersive-ar").then(ok=>{if(ok)btn.classList.remove("hide")})}
  });
  r.xr.addEventListener("sessionstart",()=>{ar=true;p=false;if(mod)mod.visible=false;Rm.visible=false;hs=null;hq=false;btn.classList.add("hide");back.style.display="none";ret.classList.add("on")});
  r.xr.addEventListener("sessionend",()=>{ar=false;x=null;ret.classList.remove("on");Rm.visible=false;if(mod)mod.visible=false;if("xr"in navigator)btn.classList.remove("hide");back.style.display="block"});
  c.addEventListener("click",()=>{if(ar&&Rm.visible&&mod&&!p){mod.position.setFromMatrixPosition(Rm.matrix);mod.quaternion.setFromRotationMatrix(Rm.matrix);mod.scale.set(.08,.08,.08);mod.visible=true;p=true;Rm.visible=false;ret.classList.remove("on")}});
  r.setAnimationLoop((_,f)=>{if(ar&&f&&!p){const ref=r.xr.getReferenceSpace(),ss=r.xr.getSession();if(ref&&ss){if(!hq){ss.requestReferenceSpace("viewer").then(v=>ss.requestHitTestSource({space:v}).then(src=>hs=src));ss.addEventListener("end",()=>{hq=false;hs=null});hq=true}if(hs){const res=f.getHitTestResults(hs);if(res.length){const pose=res[0].getPose(ref);if(pose){Rm.visible=true;Rm.matrix.fromArray(pose.transform.matrix)}}else Rm.visible=false}}}r.render(s,cam)});
}
btn.onclick=async()=>{if(x)return;try{x=await navigator.xr.requestSession("immersive-ar",{requiredFeatures:["hit-test"]});r.xr.setSession(x)}catch(e){}};
init();
</script>
</body>
</html>
