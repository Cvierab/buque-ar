<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Buque AR</title>
<meta name="theme-color" content="#000000" />
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000;width:100%;height:100%}
canvas{position:fixed;inset:0;width:100vw;height:100dvh;touch-action:none}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none;font-family:system-ui,-apple-system,sans-serif}
#btn{position:absolute;left:50%;bottom:clamp(20px,5vw,36px);transform:translateX(-50%);pointer-events:auto;border:0;border-radius:999px;background:#fff;color:#111;padding:clamp(12px,3vw,16px) clamp(20px,5vw,32px);font-size:clamp(14px,3.5vw,16px);font-weight:600;box-shadow:0 20px 60px -30px #fff}
#btn.h{display:none}
#btn[disabled]{opacity:.4}
#ret{position:absolute;top:50%;left:50%;width:clamp(56px,14vw,76px);height:clamp(56px,14vw,76px);transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;opacity:0;pointer-events:none}
#ret.on{opacity:1}
#ret:before,#ret:after{content:"";position:absolute;top:50%;left:50%;width:clamp(8px,2vw,10px);height:2px;background:#fff;transform:translate(-50%,-50%)}
#ret:after{transform:translate(-50%,-50%) rotate(90deg)}
#d{position:absolute;top:50%;left:50%;width:clamp(5px,1.2vw,7px);height:clamp(5px,1.2vw,7px);border-radius:50%;background:#fff;transform:translate(-50%,-50%);animation:p 1.4s ease-in-out infinite}
@keyframes p{0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.98}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}
#back{position:absolute;top:clamp(10px,2.5vw,14px);left:clamp(10px,2.5vw,14px);pointer-events:auto;border:0;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;padding:clamp(5px,2vw,7px) clamp(9px,2.2vw,11px);font-size:clamp(11px,2.5vw,12px);backdrop-filter:blur(6px)}
#hint{position:absolute;bottom:clamp(72px,14vw,108px);left:50%;transform:translateX(-50%);border-radius:999px;background:rgba(0,0,0,.72);color:#fff;padding:clamp(5px,2vw,7px) clamp(9px,2.5vw,12px);font-size:clamp(10px,2.4vw,11px);white-space:nowrap;opacity:0;transition:opacity .15s ease}
#hint.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<button id="back">← Volver</button>
<div id="ret"><div id="d"></div></div>
<div id="hint">Mueve el móvil para detectar superficies • Toca para colocar</div>
<button id="btn" class="h">Ver en AR</button>
</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const c=document.getElementById("c"),btn=document.getElementById("btn"),retEl=document.getElementById("ret"),back=document.getElementById("back"),hint=document.getElementById("hint");
let s,cam,r,mod,hs=null,hq=false,ar=false,p=false,x=null;
back.onclick=()=>location.href="./index.html";
function sz(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)}
async function init(){
  s=new THREE.Scene();cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,16);
  s.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,3));
  const dl=new THREE.DirectionalLight(0xffffff,1.35);dl.position.set(1,3,2);s.add(dl);
  r=new THREE.WebGLRenderer({canvas:c,alpha:true,antialias:true});
  r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.xr.enabled=true;r.xr.setReferenceSpaceType("local");
  const g=new THREE.RingGeometry(.12,.175,32).rotateX(-Math.PI/2);const rm=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffffff}));rm.matrixAutoUpdate=false;rm.visible=false;s.add(rm);window.R=rm;
  new GLTFLoader().load("./ALMT_BLANCO.glb",(gl)=>{mod=gl.scene;mod.visible=false;mod.traverse(ch=>{if(ch.isMesh&&ch.material){ch.castShadow=ch.receiveShadow=true;ch.material.metalness=.05;ch.material.roughness=.85}});s.add(mod);
    if(navigator.xr){navigator.xr.isSessionSupported("immersive-ar").then(ok=>{if(ok)btn.classList.remove("h")})}else{btn.disabled=true;btn.textContent="AR no disponible";btn.classList.remove("h")}
  });
  r.xr.addEventListener("sessionstart",()=>{ar=true;p=false;if(mod)mod.visible=false;window.R.visible=false;hs=null;hq=false;btn.classList.add("h");back.classList.add("h");retEl.classList.add("on");hint.classList.add("on")});
  r.xr.addEventListener("sessionend",()=>{ar=false;x=null;retEl.classList.remove("on");hint.classList.remove("on");window.R.visible=false;if(mod)mod.visible=false;if(navigator.xr)btn.classList.remove("h");back.classList.remove("h")});
  c.addEventListener("click",()=>{if(ar&&window.R.visible&&mod&&!p){mod.position.setFromMatrixPosition(window.R.matrix);mod.quaternion.setFromRotationMatrix(window.R.matrix);mod.scale.set(.08,.08,.08);mod.visible=true;p=true;window.R.visible=false;retEl.classList.remove("on");hint.classList.remove("on")}});
  addEventListener("resize",sz);r.setAnimationLoop(Rf)}
btn.onclick=async()=>{if(x)return;try{x=await navigator.xr.requestSession("immersive-ar",{requiredFeatures:["hit-test"]});r.xr.setSession(x)}catch(e){}};
function Rf(_,f){if(ar&&f&&!p){const ref=r.xr.getReferenceSpace(),s=r.xr.getSession(),rm=window.R;if(ref&&s&&rm){if(!hq){s.requestReferenceSpace("viewer").then(vs=>s.requestHitTestSource({space:vs}).then(src=>hs=src));s.addEventListener("end",()=>{hq=false;hs=null});hq=true}if(hs){const res=f.getHitTestResults(hs);if(res.length){const pose=res[0].getPose(ref);if(pose){rm.visible=true;rm.matrix.fromArray(pose.transform.matrix)}}else rm.visible=false}}}r.render(s,cam)}
init();
</script>
</body>
</html>
