<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Buque AR - ALMT BLANCO</title>
  <meta name="theme-color" content="#000000" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #webgl {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      outline: none;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    #startBtn {
      position: absolute;
      left: 50%;
      bottom: clamp(24px, 6vw, 40px);
      transform: translateX(-50%);
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vw, 10px);
      padding: clamp(14px, 3.5vw, 18px) clamp(24px, 6vw, 40px);
      border-radius: 999px;
      border: none;
      background: rgba(255, 255, 255, 0.98);
      color: #111;
      font-size: clamp(14px, 3.5vw, 17px);
      font-weight: 600;
      letter-spacing: -0.01em;
      box-shadow: 0 20px 80px -30px rgba(255, 255, 255, 0.9),
        0 10px 60px -20px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px) saturate(140%);
      transition: transform 0.2s ease, opacity 0.3s ease;
      white-space: nowrap;
    }

    #startBtn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(8px);
    }

    #startBtn:active {
      transform: translateX(-50%) scale(0.995);
    }

    #startBtn:disabled {
      opacity: 0.5;
    }

    #status {
      position: absolute;
      top: clamp(20px, 5vw, 32px);
      left: 50%;
      transform: translateX(-50%);
      padding: clamp(6px, 2vw, 10px) clamp(14px, 4vw, 18px);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: clamp(11px, 2.8vw, 13px);
      text-align: center;
      backdrop-filter: blur(10px) saturate(140%);
      box-shadow: 0 10px 60px -30px rgba(0, 0, 0, 0.9);
      transition: opacity 0.3s ease, transform 0.3s ease;
      white-space: nowrap;
      max-width: min(92vw, 92%);
    }

    #status.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(-6px);
      pointer-events: none;
    }

    #reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(70px, 18vw, 96px);
      height: clamp(70px, 18vw, 96px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: clamp(2px, 0.8vw, 2.5px) solid rgba(255, 255, 255, 0.95);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    #reticle::before,
    #reticle::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(10px, 3vw, 14px);
      height: clamp(2px, 0.8vw, 2.5px);
      background: rgba(255, 255, 255, 0.98);
      transform: translate(-50%, -50%);
    }

    #reticle::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    #reticle.visible {
      opacity: 1;
    }

    .dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(6px, 1.5vw, 8px);
      height: clamp(6px, 1.5vw, 8px);
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(0.9);
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.15);
      }
    }

    #hint {
      position: absolute;
      bottom: clamp(80px, 16vw, 120px);
      left: 50%;
      transform: translateX(-50%);
      padding: clamp(6px, 2vw, 8px) clamp(12px, 3.5vw, 16px);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: clamp(10px, 2.5vw, 12px);
      text-align: center;
      backdrop-filter: blur(10px) saturate(140%);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: translateX(-50%) translateY(6px);
    }

    #hint.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 4vw, 20px);
      background: #000;
      z-index: 20;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: clamp(48px, 10vw, 64px);
      height: clamp(48px, 10vw, 64px);
      border-radius: 50%;
      border: clamp(3px, 0.8vw, 4px) solid rgba(255, 255, 255, 0.15);
      border-top-color: #fff;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #loaderText {
      color: #fff;
      font-size: clamp(13px, 3.2vw, 15px);
      text-align: center;
      padding: 0 clamp(20px, 5vw, 32px);
    }

    #backBtn {
      position: absolute;
      top: clamp(12px, 3vw, 16px);
      left: clamp(12px, 3vw, 16px);
      pointer-events: auto;
      padding: clamp(6px, 2vw, 8px) clamp(10px, 2.5vw, 12px);
      border-radius: 999px;
      border: none;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: clamp(11px, 2.5vw, 12px);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 60px -30px rgba(0, 0, 0, 0.9);
      transition: opacity 0.3s ease, transform 0.2s ease;
    }

    #backBtn.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #backBtn:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <canvas id="webgl"></canvas>

  <div id="ui">
    <button id="backBtn" onclick="window.location.href='./index.html'">← Volver</button>
    <div id="status" class="hidden"></div>
    <div id="reticle">
      <div class="dot"></div>
    </div>
    <div id="hint">Mueve el dispositivo para detectar superficies • Toca para colocar el buque</div>
    <button id="startBtn" class="hidden">Comenzar en AR</button>
  </div>

  <div id="loader">
    <div class="spinner"></div>
    <div id="loaderText">Cargando modelo...</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const canvas = document.getElementById("webgl");
    const loaderEl = document.getElementById("loader");
    const loaderText = document.getElementById("loaderText");
    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");
    const reticleEl = document.getElementById("reticle");
    const hintEl = document.getElementById("hint");
    const backBtn = document.getElementById("backBtn");

    let scene, camera, renderer;
    let model = null;
    let reticle = null;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let isAR = false;
    let modelPlaced = false;
    let session = null;

    const showStatus = (text, timeout = 2400) => {
      statusEl.textContent = text;
      statusEl.classList.remove("hidden");
      clearTimeout(showStatus.t);
      showStatus.t = setTimeout(() => statusEl.classList.add("hidden"), timeout);
    };

    const checkSupport = async () => {
      if (!navigator.xr) return false;
      try {
        const supported = await navigator.xr.isSessionSupported("immersive-ar");
        return supported;
      } catch (e) {
        return false;
      }
    };

    const init = async () => {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(
        70,
        innerWidth / innerHeight,
        0.01,
        30
      );

      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3));
      const dl = new THREE.DirectionalLight(0xffffff, 1.6);
      dl.position.set(1, 3, 2);
      scene.add(dl);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.xr.enabled = true;
      renderer.xr.setReferenceSpaceType("local");

      const rg = new THREE.RingGeometry(0.14, 0.2, 32).rotateX(-Math.PI / 2);
      const rm = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95 });
      reticle = new THREE.Mesh(rg, rm);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      const gltfLoader = new GLTFLoader();
      gltfLoader.load(
        "./ALMT_BLANCO.glb",
        (gltf) => {
          model = gltf.scene;
          model.visible = false;
          model.traverse((c) => {
            if (c.isMesh) {
              c.castShadow = c.receiveShadow = true;
              if (c.material) {
                c.material.metalness = 0.05;
                c.material.roughness = 0.85;
              }
            }
          });
          scene.add(model);
          loaderEl.classList.add("hidden");
          startBtn.classList.remove("hidden");
          backBtn.classList.remove("hidden");
        },
        (xhr) => {
          if (xhr.total > 0) {
            loaderText.textContent = `Cargando modelo... ${Math.round((xhr.loaded / xhr.total) * 100)}%`;
          }
        },
        () => {
          loaderText.textContent = "Error al cargar el modelo";
        }
      );

      renderer.xr.addEventListener("sessionstart", () => {
        isAR = true;
        modelPlaced = false;
        if (model) model.visible = false;
        reticle.visible = false;
        hitTestSourceRequested = false;
        hitTestSource = null;
        startBtn.classList.add("hidden");
        backBtn.classList.add("hidden");
        reticleEl.classList.add("visible");
        hintEl.classList.add("visible");
        showStatus("Mueve el dispositivo para detectar superficies", 3200);
      });

      renderer.xr.addEventListener("sessionend", () => {
        isAR = false;
        session = null;
        reticleEl.classList.remove("visible");
        hintEl.classList.remove("visible");
        if (model) model.visible = false;
        reticle.visible = false;
        startBtn.classList.remove("hidden");
        backBtn.classList.remove("hidden");
      });

      canvas.addEventListener("click", onSelect, { passive: true });
      addEventListener("resize", onResize);

      const supported = await checkSupport();
      if (!supported) {
        startBtn.textContent = "AR no disponible en este navegador";
        startBtn.disabled = true;
        startBtn.classList.remove("hidden");
        backBtn.classList.remove("hidden");
        showStatus("WebXR AR no está soportado en este dispositivo/navegador", 4000);
      }

      renderer.setAnimationLoop(render);
    };

    const startAR = async () => {
      if (session) return;
      try {
        session = await navigator.xr.requestSession("immersive-ar", {
          requiredFeatures: ["hit-test"],
        });
        renderer.xr.setSession(session);
      } catch (err) {
        console.warn(err);
        showStatus("No se pudo iniciar AR. Prueba en Chrome/Edge (Android) o usa la experiencia Universal", 3200);
      }
    };

    startBtn.addEventListener("click", startAR);

    const onSelect = () => {
      if (isAR && reticle.visible && model && !modelPlaced) {
        model.position.setFromMatrixPosition(reticle.matrix);
        model.quaternion.setFromRotationMatrix(reticle.matrix);
        model.scale.set(0.08, 0.08, 0.08);
        model.visible = true;
        modelPlaced = true;
        reticle.visible = false;
        reticleEl.classList.remove("visible");
        hintEl.classList.remove("visible");
        showStatus("¡Buque colocado!", 1800);
      }
    };

    const onResize = () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    };

    const render = (t, frame) => {
      if (isAR && frame && !modelPlaced) {
        const refSpace = renderer.xr.getReferenceSpace();
        const s = renderer.xr.getSession();
        if (refSpace && s) {
          if (!hitTestSourceRequested) {
            s.requestReferenceSpace("viewer").then((vs) => {
              s.requestHitTestSource({ space: vs }).then((src) => (hitTestSource = src));
            });
            s.addEventListener("end", () => {
              hitTestSourceRequested = false;
              hitTestSource = null;
            });
            hitTestSourceRequested = true;
          }
          if (hitTestSource) {
            const res = frame.getHitTestResults(hitTestSource);
            if (res.length > 0) {
              const pose = res[0].getPose(refSpace);
              if (pose) {
                reticle.visible = true;
                reticle.matrix.fromArray(pose.transform.matrix);
              }
            } else {
              reticle.visible = false;
            }
          }
        }
      }
      renderer.render(scene, camera);
    };

    init();
  </script>
</body>

</html>
