<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Buque AR - Cámara + 3D</title>
    <meta name="theme-color" content="#000000" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
      }
      #ui {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #btn {
        position: absolute;
        left: 50%;
        bottom: clamp(20px, 5vw, 40px);
        transform: translateX(-50%);
        pointer-events: auto;
        padding: clamp(12px, 3vw, 16px) clamp(22px, 5.5vw, 36px);
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #111;
        font-size: clamp(14px, 3.5vw, 16px);
        font-weight: 600;
        box-shadow: 0 20px 80px -30px #fff;
        transition: transform 0.1s ease;
      }
      #btn:active {
        transform: translateX(-50%) scale(0.995);
      }
      #btn.hide {
        display: none;
      }
      #btn[disabled] {
        opacity: 0.4;
      }
      #ret {
        position: absolute;
        top: 50%;
        left: 50%;
        width: clamp(58px, 14vw, 78px);
        height: clamp(58px, 14vw, 78px);
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255, 255, 255, 0.98);
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
      }
      #ret.on {
        opacity: 1;
      }
      #ret:before,
      #ret:after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: clamp(8px, 2vw, 10px);
        height: 2px;
        background: #fff;
        transform: translate(-50%, -50%);
      }
      #ret:after {
        transform: translate(-50%, -50%) rotate(90deg);
      }
      #d {
        position: absolute;
        top: 50%;
        left: 50%;
        width: clamp(5px, 1.2vw, 7px);
        height: clamp(5px, 1.2vw, 7px);
        border-radius: 50%;
        background: #fff;
        transform: translate(-50%, -50%);
        animation: p 1.4s ease-in-out infinite;
      }
      @keyframes p {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(0.9);
          opacity: 0.98;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.16);
          opacity: 1;
        }
      }
      #back {
        position: absolute;
        top: clamp(10px, 2.5vw, 14px);
        left: clamp(10px, 2.5vw, 14px);
        pointer-events: auto;
        padding: clamp(5px, 2vw, 7px) clamp(9px, 2.2vw, 11px);
        border: 0;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        font-size: clamp(11px, 2.5vw, 12px);
        backdrop-filter: blur(6px);
      }
      #hint {
        position: absolute;
        bottom: clamp(74px, 14vw, 110px);
        left: 50%;
        transform: translateX(-50%);
        padding: clamp(5px, 2vw, 7px) clamp(9px, 2.5vw, 12px);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        font-size: clamp(10px, 2.4vw, 11px);
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      #hint.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui">
      <button id="back">← Volver</button>
      <div id="ret"><div id="d"></div></div>
      <div id="hint">Mueve el móvil para detectar superficies • Toca para colocar</div>
      <button id="btn" class="hide">Ver en AR</button>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const c = document.getElementById("c"),
        btn = document.getElementById("btn"),
        retEl = document.getElementById("ret"),
        back = document.getElementById("back"),
        hint = document.getElementById("hint");
      let scene, cam, rend, mod, r, hsrc = null, hreq = false, ar = false, placed = false, sess = null;

      back.onclick = () => (location.href = "./index.html");

      async function init() {
        scene = new THREE.Scene();
        cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 18);
        scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3));
        const dl = new THREE.DirectionalLight(0xffffff, 1.4);
        dl.position.set(1, 3, 2);
        scene.add(dl);

        rend = new THREE.WebGLRenderer({ canvas: c, alpha: true, antialias: true });
        rend.setPixelRatio(Math.min(devicePixelRatio, 2));
        rend.setSize(innerWidth, innerHeight);
        rend.xr.enabled = true;
        rend.xr.setReferenceSpaceType("local");

        const g = new THREE.RingGeometry(0.12, 0.18, 32).rotateX(-Math.PI / 2);
        r = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0xffffff }));
        r.matrixAutoUpdate = false;
        r.visible = false;
        scene.add(r);

        new GLTFLoader().load(
          "./ALMT_BLANCO.glb",
          (gl) => {
            mod = gl.scene;
            mod.visible = false;
            mod.traverse((ch) => {
              if (ch.isMesh && ch.material) {
                ch.castShadow = ch.receiveShadow = true;
                ch.material.metalness = 0.05;
                ch.material.roughness = 0.85;
              }
            });
            scene.add(mod);
            if (navigator.xr) {
              navigator.xr.isSessionSupported("immersive-ar").then((ok) => {
                if (ok) btn.classList.remove("hide");
              });
            } else {
              btn.disabled = true;
              btn.textContent = "AR no disponible";
              btn.classList.remove("hide");
            }
          },
          () => {},
          () => {}
        );

        rend.xr.addEventListener("sessionstart", () => {
          ar = true;
          placed = false;
          if (mod) mod.visible = false;
          r.visible = false;
          hsrc = null;
          hreq = false;
          btn.classList.add("hide");
          back.classList.add("hide");
          retEl.classList.add("on");
          hint.classList.add("show");
        });
        rend.xr.addEventListener("sessionend", () => {
          ar = false;
          sess = null;
          retEl.classList.remove("on");
          hint.classList.remove("show");
          r.visible = false;
          if (mod) mod.visible = false;
          if (navigator.xr) btn.classList.remove("hide");
          back.classList.remove("hide");
        });

        c.addEventListener("click", () => {
          if (ar && r.visible && mod && !placed) {
            mod.position.setFromMatrixPosition(r.matrix);
            mod.quaternion.setFromRotationMatrix(r.matrix);
            mod.scale.set(0.08, 0.08, 0.08);
            mod.visible = true;
            placed = true;
            r.visible = false;
            retEl.classList.remove("on");
            hint.classList.remove("show");
          }
        });
        addEventListener("resize", () => {
          cam.aspect = innerWidth / innerHeight;
          cam.updateProjectionMatrix();
          rend.setSize(innerWidth, innerHeight);
        });
        rend.setAnimationLoop(render);
      }

      btn.onclick = async () => {
        if (sess) return;
        try {
          sess = await navigator.xr.requestSession("immersive-ar", {
            requiredFeatures: ["hit-test"],
          });
          rend.xr.setSession(sess);
        } catch (e) {}
      };

      function render(_, frame) {
        if (ar && frame && !placed) {
          const ref = rend.xr.getReferenceSpace();
          const s = rend.xr.getSession();
          if (ref && s) {
            if (!hreq) {
              s.requestReferenceSpace("viewer")
                .then((vs) => s.requestHitTestSource({ space: vs }).then((src) => (hsrc = src)));
              s.addEventListener("end", () => {
                hreq = false;
                hsrc = null;
              });
              hreq = true;
            }
            if (hsrc) {
              const res = frame.getHitTestResults(hsrc);
              if (res.length > 0) {
                const p = res[0].getPose(ref);
                if (p) {
                  r.visible = true;
                  r.matrix.fromArray(p.transform.matrix);
                }
              } else {
                r.visible = false;
              }
            }
          }
        }
        rend.render(scene, cam);
      }
      init();
    </script>
  </body>
</html>
